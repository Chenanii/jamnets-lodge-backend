
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lcms-app
    container_name: jamnets-lodge-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - lcms-network

  nginx:
    image: nginx:alpine
    container_name: lcms-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      
    depends_on:
      - app
    networks:
      - lcms-network

  mysql:
    image: mysql:8
    container_name: jamnets-lodge-backend-mysql-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lcms_db
      MYSQL_USER: nexacircuit
      MYSQL_PASSWORD: NC2025circuit
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lcms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
      start_period: 5s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lcms-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - lcms-network

networks:
  lcms-network:

volumes:
  db_data:
